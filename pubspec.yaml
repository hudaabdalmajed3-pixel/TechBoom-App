name: tb_game
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # 🌟 تمت إضافة مكتبة الترجمة هنا 🌟
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  audioplayers: ^6.7.1 # 🌟 مكتبة الصوت
  firebase_auth: ^6.5.3
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1" # 🌟 تمت إضافة مكتبة الأيقونات هنا

# 🌟 إعدادات أيقونة اللعبة 🌟
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png" # تأكد من وضع صورة الأيقونة بهذا الاسم في هذا المسار

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/ # 🌟 تم إضافة مسار الأصوات هنا

  # إضافة خط Cairo للعبة
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700